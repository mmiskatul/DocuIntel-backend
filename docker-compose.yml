version: '3.8'

services:
  # 1. Frontend: Next.js 16 + TypeScript + Tailwind CSS + shadcn
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: docuintel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - docuintel-net

  # 2. Main API Gateway: Document Management & Supabase Controller
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OCR_MODEL_URL=http://ocr-model:7860
      - DATABASE_URL=${DATABASE_URL:-postgresql://USER:PASSWORD@HOST:5432/postgres
      - SUPABASE_URL=${SUPABASE_URL:-https://PROJECT_REF.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-docuintel-enterprise-jwt-secret-key-2026}
    depends_on:
      - ocr-model
      - redis
    networks:
      - docuintel-net

  # 3. Microservice: FastAPI + Pydantic + PyMuPDF + PaddleOCR/RapidOCR + Multi-LLM
  ocr-model:
    build:
      context: ../ocr-model
      dockerfile: Dockerfile
    container_name: docuintel-ocr-model
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    depends_on:
      - redis
    networks:
      - docuintel-net

  # 4. Redis: In-Memory Message Broker & Job Queue (Image 2)
  redis:
    image: redis:7-alpine
    container_name: docuintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docuintel-net

  # 5. Background Worker: Python Job Consumer with Retries & Progress Tracking (Image 2)
  worker:
    build:
      context: ../ocr-model
      dockerfile: Dockerfile
    container_name: docuintel-worker
    restart: unless-stopped
    command: ["python", "-m", "src.queue.worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    depends_on:
      - redis
      - ocr-model
    networks:
      - docuintel-net

volumes:
  redis-data:

networks:
  docuintel-net:
    driver: bridge

